<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill & Certification Portal - Login</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            margin-top: 100px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        .nav-tabs .nav-link {
            color: #495057;
            font-weight: 500;
        }
        .nav-tabs .nav-link.active {
            color: #0d6efd;
            border-bottom: 3px solid #0d6efd;
        }
        .portal-header {
            background-color: #212529;
            color: white;
            padding: 20px;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card login-card border-0">
                <!-- Header -->
                <div class="portal-header text-center">
                    <h4 class="mb-1">Academic Portal</h4>
                    <p class="mb-0 text-muted small">Skill Development & Certification Management</p>
                </div>
                
                <!-- Card Body -->
                <div class="card-body p-4">
                    <!-- Tabs to switch roles -->
                    <nav class="nav nav-tabs justify-content-center mb-4 border-bottom-0" id="loginTabs" role="tablist">
                        <button class="nav-link active border-0 px-4 py-2" id="student-tab" data-bs-toggle="tab" data-bs-target="#student-form" type="button" role="tab">Student Login</button>
                        <button class="nav-link border-0 px-4 py-2" id="faculty-tab" data-bs-toggle="tab" data-bs-target="#faculty-form" type="button" role="tab">Faculty Login</button>
                    </nav>

                    <div class="tab-content" id="nav-tabContent">
                        <!-- Student Form -->
                        <div class="tab-pane fade show active" id="student-form" role="tabpanel">
                            <form action="student.html" method="GET">
                                <div class="mb-3">
                                    <label class="form-label">Student Email / ID</label>
                                    <input type="text" class="form-control" placeholder="e.g., student@college.edu" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Password</label>
                                    <input type="password" class="form-control" placeholder="••••••••" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Log In as Student</button>
                            </form>
                        </div>

                        <!-- Faculty Form -->
                        <div class="tab-pane fade" id="faculty-form" role="tabpanel">
                            <form action="faculty.html" method="GET">
                                <div class="mb-3">
                                    <label class="form-label">Faculty Email / ID</label>
                                    <input type="text" class="form-control" placeholder="e.g., faculty@college.edu" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Password</label>
                                    <input type="password" class="form-control" placeholder="••••••••" required>
                                </div>
                                <button type="submit" class="btn btn-dark w-100 py-2 mt-2">Log In as Faculty</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 Bundle JS CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
